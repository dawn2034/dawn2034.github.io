name: Build and Publish Chirpy

on:
  # Daily content is published via the permanent trigger PR after atomic source
  # verification. Config/theme edits retain push builds; schedules are fallback.
  push:
    branches: [master]
    paths:
      - 'chirpy-src/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.github/workflows/chirpy-site.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize]
    paths:
      - 'chirpy-src/.dailyepoch-publish-trigger'
  schedule:
    - cron: '17 1,3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chirpy-production
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.number == 7 &&
       github.event.pull_request.head.ref == 'automation/chirpy-publish' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JEKYLL_ENV: production
      TRIGGER_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Always build current production source, never a stale event snapshot
          # or code supplied by a trigger branch / another pull request.
          ref: master

      - name: Record source snapshot
        shell: bash
        run: echo "BUILD_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Test publication guards
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Prepare posts
        run: python3 .github/scripts/chirpy_publish.py prepare

      - name: Build Chirpy
        run: python3 .github/scripts/chirpy_publish.py build

      - name: Validate generated site
        run: python3 .github/scripts/chirpy_publish.py validate

      - name: Publish static site to master
        run: python3 .github/scripts/chirpy_publish.py publish
