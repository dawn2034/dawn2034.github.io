name: Materialize DailyEpoch archive

on:
  push:
    paths:
      - '.github/workflows/materialize-dailyepoch.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore DailyEpoch files from prepared Git tree
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TREE_SHA: f542bbdd36935dd79749276640a2be6e2b0a6f27
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          tree_sha = os.environ['TREE_SHA']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          tree = get(f'https://api.github.com/repos/{repo}/git/trees/{tree_sha}?recursive=1')
          entries = [e for e in tree['tree'] if e.get('type') == 'blob' and e.get('path','').startswith('DailyEpoch/')]
          if not entries:
              raise SystemExit('No DailyEpoch blobs found in prepared tree')
          for e in entries:
              blob = get(e['url'])
              data = base64.b64decode(blob['content'])
              p = pathlib.Path(e['path'])
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print('restored', p)
          print('restored files:', len(entries))
          PY
      - name: Commit archive and remove one-shot workflow
        run: |
          rm -f .github/workflows/materialize-dailyepoch.yml
          git config user.name 'DailyEpoch archive bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DailyEpoch .github/workflows/materialize-dailyepoch.yml
          git commit -m 'Add DailyEpoch AI briefs through 2026-08-11'
          git push origin HEAD:master
